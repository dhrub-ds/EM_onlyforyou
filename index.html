<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens ============ */
:root{
  --cream:#FDFBF7; --blush:#FCEEF2; --surface:#FAF6F0;
  --rose:#E88D96; --rose-soft:#F4B3B9; --rose-deep:#D2707C;
  --heading:#6E4F53; --text:#9E8285; --coral:#F2877A;
  --hi:rgba(255,255,255,.85); --lo:rgba(220,208,212,.65);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  /* Every shadow set uses the same 4-layer shape (2 outer + 2 inset) so
     extruded <-> inset states interpolate smoothly instead of snapping. */
  --ext:-5px -5px 11px var(--hi),5px 5px 11px var(--lo),inset 0 0 0 0 transparent,inset 0 0 0 0 transparent;
  --inset:0 0 0 0 transparent,0 0 0 0 transparent,inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);
  --btn-ext:-6px -6px 14px var(--hi),7px 8px 18px rgba(214,128,142,.5),inset 0 0 0 0 transparent,inset 0 0 0 0 transparent;
  --btn-in:0 0 0 0 transparent,0 0 0 0 transparent,inset 4px 4px 10px rgba(150,66,82,.5),inset -4px -4px 9px rgba(255,255,255,.32);
  --glow:0 0 0 3px rgba(232,141,150,.3),0 0 20px rgba(232,141,150,.45);
  --none:0 0 0 0 transparent;

  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;display:grid;place-items:center;
  font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(110% 80% at 15% 8%,var(--blush) 0%,transparent 60%),
    radial-gradient(90% 70% at 90% 95%,var(--blush) 0%,transparent 58%),
    var(--cream);
}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}

/* ============ Card + floating orb ============ */
.wrap{width:min(100%,27rem);padding:3.6rem 1rem 1.6rem}
.card{position:relative;background:var(--surface);border-radius:2.25rem;
  box-shadow:-12px -12px 28px var(--hi),14px 14px 32px var(--lo)}
.stage{display:grid;padding:4.2rem clamp(1.25rem,6vw,2rem) 2rem}  /* views share one grid cell: zero layout shift */
.orb{position:absolute;left:50%;top:-2.8rem;width:5.6rem;height:5.6rem;margin-left:-2.8rem;border-radius:50%;
  display:grid;place-items:center;color:#fff;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;
  background:radial-gradient(circle at 32% 26%,#FFE6EA,var(--rose-soft) 52%,var(--rose));
  box-shadow:-6px -6px 14px var(--hi),8px 10px 22px rgba(214,128,142,.45),inset 3px 3px 8px rgba(255,255,255,.55);
  animation:float 6s ease-in-out infinite}
.orb svg{grid-area:1/1;width:2.2rem;height:2.2rem;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;will-change:transform,opacity;transform:translate3d(0,0,0) scale(.6) rotate(-25deg);
  transition:opacity .38s var(--ease),transform .38s var(--ease)}
[data-view="0"] .i0,[data-view="1"] .i1,[data-view="2"] .i2,[data-view="3"] .i3,[data-view="4"] .i4{opacity:1;transform:translate3d(0,0,0)}
[data-view="2"] .orb::after,[data-view="4"] .orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--rose-soft);will-change:transform,opacity;animation:ring 1.6s ease-out 2}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-7px,0)}}
@keyframes ring{from{transform:translate3d(0,0,0) scale(1);opacity:.9}to{transform:translate3d(0,0,0) scale(1.9);opacity:0}}

/* ============ Views: GPU-composited fade + scale + upward slide ============ */
.view{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;outline:0;will-change:transform,opacity;transform:translate3d(0,0,0);backface-visibility:hidden;
  transition:opacity .42s var(--ease),transform .42s var(--ease),visibility 0s linear 0s}
.view[data-s="before"],.view[data-s="after"]{opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .42s var(--ease),transform .42s var(--ease),visibility 0s linear .42s}
.view[data-s="before"]{transform:translate3d(0,-22px,0) scale(.96)}
.view[data-s="after"]{transform:translate3d(0,22px,0) scale(.96)}

h1,h2{margin:0 0 .6rem;color:var(--heading);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(2rem,7vw,2.5rem)}
h2{font-size:clamp(1.5rem,5.5vw,1.8rem)}
p{margin:0;line-height:1.6;max-width:25ch;font-size:1rem}
.view>p+.btn{margin-top:2rem}

/* ============ Buttons ============ */
.btn{border:0;cursor:pointer;border-radius:999px;min-width:11.5rem;padding:1rem 2.4rem;
  font-size:1.05rem;font-weight:700;letter-spacing:.01em;color:#fff;text-shadow:0 1px 2px rgba(140,60,76,.4);
  background:linear-gradient(145deg,var(--rose),var(--rose-deep));box-shadow:var(--btn-ext);
  will-change:transform;transition:box-shadow .16s var(--ease),transform .16s var(--ease),opacity .2s}
.btn:active,.btn.pressed{box-shadow:var(--btn-in);transform:scale(.985)}
@media (hover:hover){.btn:hover:not(:disabled){box-shadow:var(--btn-in)}}   /* extruded -> inset */
.btn:focus-visible{outline:0;box-shadow:var(--btn-ext),var(--glow)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--btn-ext)}
.btn.soft{background:var(--surface);color:var(--rose-deep);text-shadow:none;box-shadow:var(--ext)}
.btn.soft:active{box-shadow:var(--inset)}
@media (hover:hover){.btn.soft:hover{box-shadow:var(--inset)}}

/* ============ PIN slots (recessed) ============ */
.pin{display:flex;gap:clamp(.7rem,3.5vw,1rem);margin:1.3rem 0 .9rem}
.slot{width:clamp(3.6rem,17vw,4.4rem);height:clamp(4.2rem,20vw,5.1rem);border-radius:1.3rem;
  display:grid;place-items:center;background:var(--surface);
  box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi),var(--none),var(--none);
  transition:box-shadow .35s var(--ease)}
.slot.on{box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi),var(--glow)}
.pin.err .slot{box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi),
  0 0 0 2px rgba(242,135,122,.9),0 0 18px rgba(242,135,122,.4)}
.dot{width:.95rem;height:.95rem;border-radius:50%;transform:scale(0);
  background:radial-gradient(circle at 35% 30%,var(--rose-soft),var(--rose));box-shadow:0 2px 6px rgba(232,141,150,.55);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.slot.full .dot{transform:scale(1)}
.pin.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.msg{min-height:1.6em;font-size:.95rem;max-width:none}
.msg.err{color:#D9695C}

/* ============ Keypad ============ */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.7rem,3vw,1rem);width:100%;max-width:18rem;margin:.9rem 0 1.4rem}
.key{height:clamp(3rem,8.5dvh,3.6rem);border:0;border-radius:1.2rem;background:var(--surface);color:var(--heading);
  display:grid;place-items:center;cursor:pointer;font-size:1.3rem;font-weight:600;box-shadow:var(--ext);
  will-change:transform;transition:box-shadow .14s var(--ease),transform .14s var(--ease),color .14s}
.key.ghost{font-size:.95rem;color:var(--text)}
.key svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.key:hover{color:var(--rose)}}
.key:focus-visible{outline:0;box-shadow:var(--ext),var(--glow)}
.key.tap,.key:active{box-shadow:var(--inset);transform:scale(.97);color:var(--rose)}

/* ============ Unlock celebration ============ */
.confetti{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);border-radius:50% 50% 50% 0;
  background:var(--c);opacity:0;animation:burst 1.9s var(--ease) var(--d) forwards}
@keyframes burst{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}
  15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}

/* ===== Birthday journey: layout, page 3 (cake), page 4 (hub), page 5 (reply) ===== */
:root{--px:clamp(1.25rem,6vw,2rem);--script:'Dancing Script','Segoe Script','Brush Script MT',cursive}
.stage{display:block;position:relative;transition:height .38s var(--ease)}  /* height follows the active view */
.view{position:absolute;top:4.2rem;left:var(--px);right:var(--px)}
.wrap{transition:none}
body[data-v="3"] .wrap, body[data-v="4"] .wrap{width:min(100%,34rem)}
.script{font-family:var(--script);font-weight:700;letter-spacing:0}
h2.script{font-size:clamp(2rem,8vw,2.5rem);line-height:1.1}
.sub{margin-top:1rem;font-size:.9rem}
.rip{position:fixed;left:0;top:0;z-index:99;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;pointer-events:none;will-change:transform,opacity;border:2px solid rgba(232,141,150,.6);animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:translate3d(var(--rx,0px),var(--ry,0px),0) scale(.3);opacity:1}to{transform:translate3d(var(--rx,0px),var(--ry,0px),0) scale(1.7);opacity:0}}
@keyframes pin{from{opacity:0;transform:translate3d(0,16px,0) scale(.97)}to{opacity:1;transform:translate3d(0,0,0)}}

/* -- Cake -- */
.cake-wrap{position:relative;width:min(100%,17rem);aspect-ratio:1;margin:.2rem 0 .3rem}
.cake{width:100%;height:100%;overflow:visible}
.cake *{transform-box:fill-box}
.half{transform-box:view-box;transform-origin:120px 206px;transition:transform .8s cubic-bezier(.34,1.56,.64,1)}
.cut .hl{transform:translateX(-13px) rotate(-3deg)}
.cut .hr{transform:translateX(13px) rotate(3deg)}
.flame{transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite;transition:opacity .35s}
.glow{animation:glow 2s ease-in-out infinite;transition:opacity .35s}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}35%{transform:scale(.93,1.1) rotate(2.5deg)}70%{transform:scale(1.05,.95) rotate(-1deg)}}
@keyframes glow{50%{opacity:.55}}
.out .flame,.out .glow{animation:none;opacity:0}
.smoke path{fill:none;stroke:#C9B9BD;stroke-width:3;stroke-linecap:round;opacity:0}
.out .smoke path{animation:smoke 2.4s ease-out forwards}
.out .smoke path:nth-child(2){animation-delay:.25s}
.out .smoke path:nth-child(3){animation-delay:.5s}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scaleY(.5)}20%{opacity:.8}100%{opacity:0;transform:translate(6px,-52px) scaleY(1.2)}}
.candle{transition:opacity .4s,transform .4s}
.cutting .candle{opacity:0;transform:translateY(10px)}
.knife{opacity:0}
.cutting .knife{animation:knife .65s cubic-bezier(.6,0,.4,1) forwards}
@keyframes knife{0%{opacity:0;transform:translateY(-110px)}20%{opacity:1}70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(8px)}}
.hit{position:absolute;border:0;background:none;cursor:pointer;border-radius:1rem}
.hit:focus-visible{outline:0;box-shadow:var(--glow)}
.hit:disabled{pointer-events:none}
.candle-hit{left:42%;top:10%;width:16%;height:33%}
.cake-hit{left:10%;top:40%;width:80%;height:48%}
.reveal{margin-top:1rem;opacity:0;visibility:hidden;transform:translateY(14px);pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease),visibility 0s .5s,box-shadow .35s var(--ease)}
.reveal.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .5s var(--ease),transform .5s var(--ease),box-shadow .35s var(--ease)}
.toast{position:absolute;left:50%;top:5rem;width:max-content;max-width:92%;text-align:center;padding:.8rem 1.4rem;border-radius:1.5rem;background:var(--surface);color:var(--heading);font:700 clamp(1.5rem,6.2vw,1.9rem)/1.2 var(--script);opacity:0;pointer-events:none;transform:translate(-50%,24px) scale(.8);box-shadow:-8px -8px 18px var(--hi),9px 9px 20px var(--lo)}
.toast.show{animation:pop .5s var(--ease) both,bob 3.2s ease-in-out .5s infinite}
@keyframes pop{from{opacity:0;transform:translate(-50%,24px) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bob{0%,100%{opacity:1;transform:translate(-50%,0) scale(1)}50%{opacity:1;transform:translate(-50%,-6px) scale(1)}}

/* -- Hub tabs -- */
.hub{align-items:stretch}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(.4rem,2vw,.7rem);margin-bottom:1.4rem}
.tab{display:grid;gap:.2rem;place-items:center;padding:.7rem .2rem;border:0;border-radius:1.15rem;cursor:pointer;background:var(--surface);color:var(--text);font-size:.74rem;font-weight:600;box-shadow:var(--ext);transition:box-shadow .35s var(--ease),color .3s,transform .3s var(--ease)}
.tab b{font-size:1.25rem;line-height:1;font-weight:400}
.tab:focus-visible{outline:0;box-shadow:var(--ext),var(--glow)}
.tab[aria-selected="true"]{box-shadow:var(--inset);color:var(--rose-deep)}
.tab:active{transform:scale(.95)}
.panel{display:none;flex-direction:column;align-items:center;text-align:center;width:100%}
.panel.on{display:flex;animation:pin .5s var(--ease) both}

/* -- Letter -- */
.mail{width:100%;display:grid;justify-items:center}
.env{width:min(100%,19rem);aspect-ratio:300/190;padding:0;border:0;background:none;border-radius:18px;cursor:pointer;box-shadow:-8px -8px 18px var(--hi),8px 8px 18px var(--lo);transition:transform .35s var(--ease)}
.env:active{transform:scale(.98)}
.env:focus-visible{outline:0;box-shadow:var(--glow)}
.env svg{display:block;width:100%;height:100%;overflow:visible}
.env .paper,.env .flap,.env .seal{transition:transform .6s var(--ease),opacity .4s .25s}
.env .flap{transform-box:view-box;transform-origin:0 0}
.env.open .flap{transform:scaleY(-1);opacity:0}
.env.open .paper{transform:translateY(-24px)}
.env.open .seal{opacity:0}
.letter{display:none;width:100%;max-width:27rem;text-align:left;padding:1.5rem 1.4rem 1.3rem;border-radius:1.5rem;background:linear-gradient(180deg,#FFFDF9,#FBF3EB);box-shadow:-8px -8px 18px var(--hi),9px 9px 20px var(--lo)}
.mail.read .env{display:none}
.mail.read .letter{display:block;animation:pin .5s var(--ease) both}
.mail.read+.sub{display:none}
.letter p{max-width:none;margin:0 0 .8rem;color:var(--heading);line-height:1.75;font-size:.98rem}
.letter .hello{font-size:1.9rem;line-height:1.2}
.letter .sign{text-align:right;font-size:1.6rem;line-height:1.2}
.letter .btn{display:block;margin:1rem auto 0;min-width:0;padding:.6rem 1.4rem;font-size:.9rem}

/* -- Pics -- */
.car{width:100%;display:grid;gap:.4rem;justify-items:center}
.vp{width:100%;overflow:hidden;padding:1rem 0 1.2rem}
.track{display:flex;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;transition:transform .42s var(--ease)}
.slide{flex:0 0 100%;display:grid;place-items:center}
.pol{display:block;width:min(78%,15rem);padding:.7rem .7rem 0;border:0;border-radius:.4rem;background:#FFFDF9;cursor:zoom-in;font:inherit;will-change:transform;transform:translate3d(0,0,0) rotate(var(--rot,-2deg));box-shadow:-6px -6px 14px var(--hi),8px 8px 18px var(--lo);transition:transform .32s var(--ease)}
.pol:active{transform:translate3d(0,0,0) rotate(0) scale(.97)}
.pol:focus-visible{outline:0;box-shadow:var(--glow)}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:.2rem}
.cap{display:block;padding:.8rem 0 .9rem;font:700 1.35rem/1 var(--script);color:var(--heading)}
.nav{display:flex;align-items:center;gap:1.1rem}
.rb{width:2.9rem;height:2.9rem;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--surface);color:var(--heading);font-size:1.5rem;line-height:1;box-shadow:var(--ext);will-change:transform;transition:box-shadow .16s var(--ease),transform .16s var(--ease)}
.rb:active{box-shadow:var(--inset);transform:scale(.94)}
.rb:focus-visible{outline:0;box-shadow:var(--ext),var(--glow)}
.dots{display:flex;gap:.5rem}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--surface);box-shadow:var(--inset);transition:transform .3s var(--ease),background-color .3s var(--ease)}
.dots i.on{background:var(--rose);box-shadow:0 0 9px rgba(232,141,150,.65);transform:scale(1.25)}
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1.2rem;background:rgba(253,251,247,.88);opacity:0;visibility:hidden;pointer-events:none;will-change:opacity;transition:opacity .35s var(--ease),visibility 0s .35s}
.lb.on{opacity:1;visibility:visible;pointer-events:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .35s var(--ease)}
.lb .pol{width:min(92vw,26rem);cursor:zoom-out;will-change:transform;transform:translate3d(0,22px,0) scale(.88);transition:transform .38s var(--ease)}
.lb.on .pol{transform:translate3d(0,0,0) scale(1)}

/* -- Notes (flip cards) -- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.7rem,3vw,1rem);width:100%}
@media (min-width:30rem){.grid{grid-template-columns:repeat(3,1fr)}}
.flip{position:relative;height:8.4rem;padding:0;border:0;background:none;cursor:pointer;perspective:800px;font:inherit}
.flip span{position:absolute;inset:0;display:grid;place-content:center;gap:.35rem;padding:.8rem;border-radius:1.3rem;background:var(--surface);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .52s cubic-bezier(.34,1.3,.64,1)}
.flip .fr{color:var(--heading);font-size:.85rem;font-weight:700;box-shadow:var(--ext)}
.flip .fr b{font-size:1.9rem;line-height:1;font-weight:400}
.flip .rv{transform:rotateY(180deg);box-shadow:var(--inset);color:var(--heading);font-size:.86rem;line-height:1.45;font-weight:500}
.flip.on .fr{transform:rotateY(-180deg)}
.flip.on .rv{transform:none}
.flip:focus-visible{outline:0}
.flip:focus-visible .fr{box-shadow:var(--ext),var(--glow)}

/* ===== Neumorphic style v2: warm rose-beige shadows, gradient faces with white rims, recessed wells ===== */
:root{--hi:#FFFFFF;--lo:#DEC5BD;--lo-deep:#D0B3AA;--well:#F2EBE3;--rose:#E88D96;--rose-deep:#D4757F;--heading:#3D2D32;--text:#826E74;
  --ease:cubic-bezier(.16,1,.3,1);--face:linear-gradient(145deg,#FFFDFB,#F6F0E9);
  --ext:-7px -7px 16px var(--hi),7px 7px 16px var(--lo),inset 0 0 0 0 transparent,inset 0 0 0 0 transparent;
  --inset:0 0 0 0 transparent,0 0 0 0 transparent,inset 4px 4px 9px var(--lo-deep),inset -4px -4px 9px var(--hi);
  --btn-ext:-6px -6px 14px var(--hi),7px 8px 18px rgba(212,117,127,.45),inset 0 0 0 0 transparent,inset 0 0 0 0 transparent;
  --glow:0 0 0 3px rgba(232,141,150,.3),0 0 22px rgba(232,141,150,.42)}
.wrap{position:relative;z-index:1}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;pointer-events:none;opacity:.65;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}
body::before{width:480px;height:480px;top:-130px;left:-130px;background:radial-gradient(circle,rgba(232,141,150,.24) 0%,rgba(232,141,150,.08) 45%,rgba(253,251,247,0) 72%);animation:amb 16s ease-in-out infinite alternate}
body::after{width:520px;height:520px;bottom:-150px;right:-130px;background:radial-gradient(circle,rgba(255,245,235,.9) 0%,rgba(252,238,242,.35) 45%,rgba(252,238,242,0) 72%);animation:amb 20s ease-in-out infinite alternate-reverse}
@keyframes amb{to{transform:translate3d(45px,35px,0) scale(1.08)}}
.card{background:linear-gradient(145deg,#FFFDFB,var(--surface));border:1px solid rgba(255,255,255,.85);box-shadow:14px 14px 28px var(--lo),-14px -14px 28px var(--hi)}
.key,.tab,.rb,.btn.soft,.flip .fr,.toast{background:var(--face);border:1px solid rgba(255,255,255,.8)}
.slot,.dots i,.flip .rv,.tab[aria-selected="true"],.key.tap,.key:active{background:var(--well)}
@media (hover:hover){.key:hover:not(:active),.
